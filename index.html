<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九九チャレンジ</title>
<style>
  :root{
    --bg:#fef9f0;
    --main:#ff8a3d;
    --main-dark:#e6702a;
    --accent:#4dabf7;
    --correct:#51cf66;
    --wrong:#ff6b6b;
    --text:#3a2e2a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,#fff6e5,#ffe8d6);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
    color:var(--text);
  }
  .app{
    width:100%;
    max-width:480px;
    background:#fff;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(200,120,50,0.18);
    padding:20px;
    position:relative;
    overflow:hidden;
  }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  h1{
    font-size:1.3em;
    margin:0;
    color:var(--main-dark);
  }
  .stopwatch{
    background:var(--main);
    color:#fff;
    font-weight:bold;
    font-size:1.1em;
    padding:8px 14px;
    border-radius:16px;
    min-width:80px;
    text-align:center;
    box-shadow:0 3px 8px rgba(230,112,42,0.4);
    letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }
  .progress-wrap{
    background:#f1e6da;
    border-radius:20px;
    height:14px;
    margin:14px 0 20px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    background:linear-gradient(90deg,var(--main),#ffb35c);
    width:0%;
    transition:width .3s ease;
  }
  .screen{display:none;}
  .screen.active{display:block;}
  .start-screen{text-align:center;padding:30px 10px;}
  .start-screen p{line-height:1.7;font-size:1.05em;}
  .kuku-emoji{font-size:3.5em;margin-bottom:6px;}
  .question-box{
    text-align:center;
    background:#fff3e2;
    border-radius:20px;
    padding:28px 10px;
    margin-bottom:20px;
    border:3px dashed #ffcf9b;
  }
  .qnum{
    font-size:0.95em;
    color:var(--main-dark);
    font-weight:bold;
    margin-bottom:6px;
  }
  .question-text{
    font-size:2.4em;
    font-weight:bold;
    color:var(--text);
    letter-spacing:2px;
  }
  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .choice-btn{
    font-size:1.6em;
    font-weight:bold;
    padding:20px 0;
    border-radius:16px;
    border:none;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 0 #2f8fd6;
    transition:transform .08s ease;
  }
  .choice-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #2f8fd6;
  }
  .choice-btn.correct{
    background:var(--correct)!important;
    box-shadow:0 4px 0 #37a34a!important;
  }
  .choice-btn.wrong{
    background:var(--wrong)!important;
    box-shadow:0 4px 0 #d94a4a!important;
  }
  .choice-btn:disabled{opacity:0.6;cursor:default;}
  .big-btn{
    display:inline-block;
    margin-top:20px;
    background:var(--main);
    color:#fff;
    font-size:1.2em;
    font-weight:bold;
    padding:14px 40px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--main-dark);
  }
  .big-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--main-dark);
  }
  .result-screen{text-align:center;padding:20px 10px;}
  .result-emoji{font-size:4em;}
  .result-title{
    font-size:1.6em;
    font-weight:bold;
    margin:10px 0;
  }
  .result-title.clear{color:var(--correct);}
  .result-title.fail{color:var(--wrong);}
  .time-display{
    font-size:2em;
    font-weight:bold;
    color:var(--main-dark);
    margin:10px 0 20px;
  }
  .fail-detail{
    background:#fff0f0;
    border-radius:14px;
    padding:14px;
    margin:14px 0;
    font-size:1.1em;
  }
  .fail-detail .q{font-weight:bold;font-size:1.3em;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🐱 九九チャレンジ</h1>
    <div class="stopwatch" id="stopwatch">0.0秒</div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <!-- スタート画面 -->
  <div class="screen active" id="startScreen">
    <div class="start-screen">
      <div class="kuku-emoji">✏️🔢</div>
      <p>九九の問題が<b>ランダムで10問</b>出ます。<br>
      1問でも間違えると終了になるよ。<br>
      全問正解でクリア、タイムが表示されます!</p>
      <button class="big-btn" id="startBtn">スタート</button>
    </div>
  </div>

  <!-- 出題画面 -->
  <div class="screen" id="quizScreen">
    <div class="question-box">
      <div class="qnum" id="qnum">第1問 / 10問</div>
      <div class="question-text" id="questionText">3 × 4 = ?</div>
    </div>
    <div class="choices" id="choices"></div>
  </div>

  <!-- 結果画面 -->
  <div class="screen" id="resultScreen">
    <div class="result-screen">
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-title" id="resultTitle"></div>
      <div id="resultBody"></div>
      <button class="big-btn" id="retryBtn">もう一度チャレンジ</button>
    </div>
  </div>
</div>

<script>
(function(){
  const startScreen = document.getElementById('startScreen');
  const quizScreen = document.getElementById('quizScreen');
  const resultScreen = document.getElementById('resultScreen');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const stopwatchEl = document.getElementById('stopwatch');
  const progressBar = document.getElementById('progressBar');
  const qnumEl = document.getElementById('qnum');
  const questionTextEl = document.getElementById('questionText');
  const choicesEl = document.getElementById('choices');
  const resultEmoji = document.getElementById('resultEmoji');
  const resultTitle = document.getElementById('resultTitle');
  const resultBody = document.getElementById('resultBody');

  const TOTAL_QUESTIONS = 10;
  let allProblems = [];
  for(let a=1; a<=9; a++){
    for(let b=1; b<=9; b++){
      allProblems.push({a:a, b:b, answer:a*b});
    }
  }

  let questions = [];
  let currentIndex = 0;
  let correctCount = 0;
  let timerInterval = null;
  let startTime = 0;
  let finished = false;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function pickQuestions(){
    questions = shuffle(allProblems).slice(0, TOTAL_QUESTIONS);
  }

  function makeChoices(correctAnswer){
    const choicesSet = new Set([correctAnswer]);
    while(choicesSet.size < 4){
      const deltaOptions = [-9,-8,-6,-4,-3,-2,-1,1,2,3,4,6,8,9];
      const delta = deltaOptions[Math.floor(Math.random()*deltaOptions.length)];
      let candidate = correctAnswer + delta;
      if(candidate < 1) candidate = correctAnswer + Math.abs(delta);
      if(candidate === correctAnswer || candidate < 1 || candidate > 90) continue;
      choicesSet.add(candidate);
    }
    return shuffle(Array.from(choicesSet));
  }

  function formatTime(ms){
    return (ms/1000).toFixed(1) + '秒';
  }

  function startTimer(){
    startTime = Date.now();
    stopwatchEl.textContent = '0.0秒';
    timerInterval = setInterval(()=>{
      const elapsed = Date.now() - startTime;
      stopwatchEl.textContent = formatTime(elapsed);
    }, 100);
  }

  function stopTimer(){
    clearInterval(timerInterval);
    return Date.now() - startTime;
  }

  function showScreen(screen){
    [startScreen, quizScreen, resultScreen].forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
  }

  function updateProgress(){
    const pct = (currentIndex / TOTAL_QUESTIONS) * 100;
    progressBar.style.width = pct + '%';
  }

  function renderQuestion(){
    if(finished) return;
    const q = questions[currentIndex];
    qnumEl.textContent = '第' + (currentIndex+1) + '問 / ' + TOTAL_QUESTIONS + '問';
    questionTextEl.textContent = q.a + ' × ' + q.b + ' = ?';
    updateProgress();

    const opts = makeChoices(q.answer);
    choicesEl.innerHTML = '';
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => handleAnswer(opt, q.answer, btn));
      choicesEl.appendChild(btn);
    });
  }

  function handleAnswer(selected, correctAnswer, btnEl){
    if(finished) return;
    const allBtns = choicesEl.querySelectorAll('.choice-btn');
    allBtns.forEach(b => b.disabled = true);

    if(selected === correctAnswer){
      btnEl.classList.add('correct');
      correctCount++;
      currentIndex++;
      updateProgress();
      if(correctCount >= TOTAL_QUESTIONS){
        finished = true;
        const elapsed = stopTimer();
        setTimeout(()=> showClear(elapsed), 500);
      } else {
        setTimeout(renderQuestion, 500);
      }
    } else {
      finished = true;
      btnEl.classList.add('wrong');
      allBtns.forEach(b => {
        if(parseInt(b.textContent,10) === correctAnswer){
          b.classList.add('correct');
        }
      });
      stopTimer();
      const q = questions[currentIndex];
      setTimeout(()=> showFail(q, selected), 900);
    }
  }

  function showClear(elapsedMs){
    resultEmoji.textContent = '🎉';
    resultTitle.textContent = 'クリア!';
    resultTitle.className = 'result-title clear';
    resultBody.innerHTML =
      '<div class="time-display">タイム: ' + formatTime(elapsedMs) + '</div>' +
      '<p>10問全問正解、おめでとう!</p>';
    showScreen(resultScreen);
  }

  function showFail(q, selected){
    resultEmoji.textContent = '😢';
    resultTitle.textContent = '残念、終了です';
    resultTitle.className = 'result-title fail';
    resultBody.innerHTML =
      '<div class="fail-detail">' +
        '<div class="q">' + q.a + ' × ' + q.b + ' = ' + q.answer + '</div>' +
        'あなたの答え: ' + selected +
      '</div>' +
      '<p>記録は残りません。もう一度チャレンジしてみよう!</p>';
    showScreen(resultScreen);
  }

  function startQuiz(){
    finished = false;
    currentIndex = 0;
    correctCount = 0;
    pickQuestions();
    showScreen(quizScreen);
    updateProgress();
    startTimer();
    renderQuestion();
  }

  startBtn.addEventListener('click', startQuiz);
  retryBtn.addEventListener('click', startQuiz);
})();
</script>
</body>
</html>
