<!DOCTYPE html><html lang="ja"><meta charset="utf-8"><title>うらボス プレビュー</title>
<style>
body{font-family:sans-serif;background:#f6f7fb;margin:0;padding:12px}
h2{font-size:16px;margin:14px 4px 6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
figure{margin:0;background:#fff;border-radius:12px;padding:8px;text-align:center}
img{width:100%}
.battle{position:relative;height:300px;border-radius:14px;overflow:hidden;background:linear-gradient(#1c1440,#3a2470)}
.battle img{position:absolute;left:50%;top:-10%;width:118%;transform:translateX(-50%)}
.battle .q{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#fff;border-radius:10px;padding:6px 16px;font-weight:900;font-size:22px}
</style>
<h2>ぜんたい</h2>
<div class="row"><figure><img src="kukudora.svg"><figcaption>だい1けいたい ククドラ</figcaption></figure>
<figure><img src="tokikui.svg"><figcaption>だい2けいたい トキクイ</figcaption></figure></div>
<h2>たたかいの がめん（ひとまわり大きく はみ出す）</h2>
<div class="row"><div class="battle"><img src="kukudora.svg"><div class="q">7 × 8 ＝ ？</div></div>
<div class="battle"><img src="tokikui.svg"><div class="q">□ × 3 ＝ 12</div></div></div>
</html>
