<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九九チャレンジ</title>
<style>
  :root{
    --bg:#fef9f0;
    --main:#ff8a3d;
    --main-dark:#e6702a;
    --accent:#4dabf7;
    --correct:#51cf66;
    --wrong:#ff6b6b;
    --text:#3a2e2a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,#fff6e5,#ffe8d6);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:20px;
    color:var(--text);
  }
  .app{
    width:100%;
    max-width:480px;
    background:#fff;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(200,120,50,0.18);
    padding:20px;
    position:relative;
    overflow:hidden;
  }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .title-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  h1{
    font-size:1.3em;
    margin:0;
    color:var(--main-dark);
  }
  .version-badge{
    display:inline-block;
    background:#fff;
    color:var(--main-dark);
    border:1.5px solid var(--main);
    font-size:0.68em;
    font-weight:bold;
    padding:2px 8px;
    border-radius:10px;
    letter-spacing:0.5px;
    white-space:nowrap;
  }
  .stopwatch{
    background:var(--main);
    color:#fff;
    font-weight:bold;
    font-size:1.1em;
    padding:8px 14px;
    border-radius:16px;
    min-width:80px;
    text-align:center;
    box-shadow:0 3px 8px rgba(230,112,42,0.4);
    letter-spacing:1px;
    font-variant-numeric:tabular-nums;
  }
  .progress-wrap{
    background:#f1e6da;
    border-radius:20px;
    height:14px;
    margin:14px 0 20px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    background:linear-gradient(90deg,var(--main),#ffb35c);
    width:0%;
    transition:width .3s ease;
  }
  .screen{display:none;}
  .screen.active{display:block;}
  .start-screen{text-align:center;padding:20px 6px;}
  .start-screen p{line-height:1.7;font-size:1.0em;}
  .kuku-emoji{font-size:3em;margin-bottom:4px;}

  /* モード切り替えタブ */
  .mode-tabs{
    display:flex;
    gap:8px;
    margin:14px 0 10px;
  }
  .mode-tab{
    flex:1;
    padding:12px 6px;
    border-radius:14px;
    border:2px solid #ffd8ae;
    background:#fff;
    color:var(--main-dark);
    font-weight:bold;
    font-size:0.95em;
    cursor:pointer;
  }
  .mode-tab.active{
    background:var(--main);
    color:#fff;
    border-color:var(--main-dark);
  }
  .mode-panel{margin-top:6px;}

  /* 段えらび */
  .dan-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:14px 0;
  }
  .dan-btn{
    position:relative;
    padding:14px 0;
    border-radius:14px;
    border:2px solid #ffd8ae;
    background:#fff8ef;
    color:var(--text);
    font-weight:bold;
    font-size:1.1em;
    cursor:pointer;
  }
  .dan-btn.selected{
    background:var(--accent);
    color:#fff;
    border-color:#2f8fd6;
  }
  .order-buttons{
    display:flex;
    gap:8px;
    margin:6px 0 4px;
  }
  .order-btn{
    position:relative;
    flex:1;
    padding:12px 4px;
    border-radius:14px;
    border:2px solid #ffd8ae;
    background:#fff;
    color:var(--main-dark);
    font-weight:bold;
    font-size:0.9em;
    cursor:pointer;
  }
  .order-btn.selected{
    background:var(--main);
    color:#fff;
    border-color:var(--main-dark);
  }
  .stamp-badge{
    position:absolute;
    top:-8px;
    right:-6px;
    font-size:1.1em;
    line-height:1;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }

  .stamp-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:#fff3e2;
    border-radius:12px;
    padding:10px 10px;
    margin:10px 0;
    font-size:0.95em;
    font-weight:bold;
    color:var(--main-dark);
  }
  .stamp-row .stamp-icon{font-size:1.3em;}
  .stamp-empty{color:#a08a78;font-weight:normal;font-size:0.9em;}

  .hidden{display:none!important;}

  .countdown-box{
    text-align:center;
    background:#fff3e2;
    border-radius:20px;
    padding:50px 10px;
    margin-bottom:20px;
    border:3px dashed #ffcf9b;
  }
  .countdown-number{
    font-size:4.5em;
    font-weight:bold;
    color:var(--main-dark);
    animation:pop .3s ease;
  }
  .countdown-label{
    font-size:1em;
    color:#a87a4a;
    font-weight:bold;
    margin-top:6px;
  }
  @keyframes pop{
    0%{transform:scale(0.6);opacity:0;}
    100%{transform:scale(1);opacity:1;}
  }

  .question-box{
    text-align:center;
    background:#fff3e2;
    border-radius:20px;
    padding:28px 10px;
    margin-bottom:20px;
    border:3px dashed #ffcf9b;
  }
  .mode-label{
    font-size:0.85em;
    color:#a87a4a;
    font-weight:bold;
    margin-bottom:2px;
  }
  .qnum{
    font-size:0.95em;
    color:var(--main-dark);
    font-weight:bold;
    margin-bottom:6px;
  }
  .question-text{
    font-size:2.4em;
    font-weight:bold;
    color:var(--text);
    letter-spacing:2px;
  }
  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .choice-btn{
    font-size:1.6em;
    font-weight:bold;
    padding:20px 0;
    border-radius:16px;
    border:none;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    box-shadow:0 4px 0 #2f8fd6;
    transition:transform .08s ease;
  }
  .choice-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #2f8fd6;
  }
  .choice-btn.correct{
    background:var(--correct)!important;
    box-shadow:0 4px 0 #37a34a!important;
  }
  .choice-btn.wrong{
    background:var(--wrong)!important;
    box-shadow:0 4px 0 #d94a4a!important;
  }
  .choice-btn:disabled{opacity:0.6;cursor:default;}
  .big-btn{
    display:inline-block;
    margin-top:16px;
    background:var(--main);
    color:#fff;
    font-size:1.2em;
    font-weight:bold;
    padding:14px 40px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--main-dark);
  }
  .big-btn:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 var(--main-dark);
  }
  .secondary-btn{
    display:inline-block;
    margin-top:12px;
    background:#fff;
    color:var(--main-dark);
    font-size:1.05em;
    font-weight:bold;
    padding:12px 32px;
    border:2px solid var(--main);
    border-radius:30px;
    cursor:pointer;
  }
  .secondary-btn:active{
    transform:translateY(2px);
  }
  .result-buttons{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .result-screen{text-align:center;padding:20px 10px;}
  .result-emoji{font-size:4em;}
  .result-title{
    font-size:1.6em;
    font-weight:bold;
    margin:10px 0;
  }
  .result-title.clear{color:var(--correct);}
  .result-title.fail{color:var(--wrong);}
  .time-display{
    font-size:2em;
    font-weight:bold;
    color:var(--main-dark);
    margin:10px 0 20px;
  }
  .fail-detail{
    background:#fff0f0;
    border-radius:14px;
    padding:14px;
    margin:14px 0;
    font-size:1.1em;
  }
  .fail-detail .q{font-weight:bold;font-size:1.3em;}

  .earned-stamp-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    margin:8px 0;
  }
  .earned-stamp-emoji{font-size:2.6em;line-height:1;}
  .earned-stamp-name{font-weight:bold;color:var(--main-dark);}
  .earned-stamp-new{
    font-size:0.85em;
    color:#e6a800;
    font-weight:bold;
  }

  .best-box{
    background:#fff8ef;
    border:2px solid #ffe6c6;
    border-radius:16px;
    padding:14px 16px;
    margin:18px 0 6px;
    text-align:left;
  }
  .best-box h3{
    margin:0 0 8px;
    font-size:0.95em;
    color:var(--main-dark);
    text-align:center;
  }
  .best-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .best-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border-radius:10px;
    padding:8px 12px;
  }
  .best-item.new{
    border:2px solid #ffca28;
    background:#fff6db;
  }
  .best-rank{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#e9c9a3;
    color:#fff;
    font-weight:bold;
    font-size:0.85em;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .best-rank.r1{background:#ffca28;}
  .best-rank.r2{background:#b0bec5;}
  .best-rank.r3{background:#d98757;}
  .best-time{
    font-weight:bold;
    color:var(--main-dark);
  }
  .best-empty{
    text-align:center;
    color:#a08a78;
    font-size:0.9em;
    padding:6px 0;
  }
  .new-record-badge{
    display:inline-block;
    background:#ffca28;
    color:#5a4200;
    font-weight:bold;
    font-size:0.9em;
    padding:6px 14px;
    border-radius:20px;
    margin-bottom:10px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title-row">
      <h1>🐱 九九チャレンジ</h1>
      <span class="version-badge">v1.6</span>
    </div>
    <div class="stopwatch" id="stopwatch">0.0秒</div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>

  <!-- スタート画面 -->
  <div class="screen active" id="startScreen">
    <div class="start-screen">
      <div class="kuku-emoji">✏️🔢</div>
      <p>問題に答えて九九をマスターしよう!<br>1問でも間違えると終了になるよ。</p>

      <div class="mode-tabs">
        <button class="mode-tab active" id="tabRandom">🎲 ランダム10問</button>
        <button class="mode-tab" id="tabDan">🔢 段をえらぶ</button>
      </div>

      <!-- ランダム10問モード -->
      <div class="mode-panel" id="randomPanel">
        <p>1の段〜9の段、ぜんぶ(81問)の中からランダムに10問出るよ。<br>全問正解でクリア!</p>
        <div class="stamp-row" id="randomStampRow"></div>
        <button class="big-btn" id="startRandomBtn">スタート</button>
        <div class="best-box">
          <h3>🏆 じぶんのベスト3</h3>
          <ul class="best-list" id="startBestList"></ul>
        </div>
      </div>

      <!-- 段をえらぶモード -->
      <div class="mode-panel" id="danPanel" style="display:none;">
        <p>れんしゅうしたい段と、といかたをえらんでね(9問)</p>
        <div class="dan-grid" id="danGrid"></div>
        <div class="order-buttons" id="orderButtons">
          <button class="order-btn" data-order="up"><span class="stamp-badge"></span>⬆️ 上り</button>
          <button class="order-btn" data-order="down"><span class="stamp-badge"></span>⬇️ 下り</button>
          <button class="order-btn" data-order="random"><span class="stamp-badge"></span>🔀 ランダム</button>
        </div>
        <div class="stamp-row" id="danStampRow"></div>
        <button class="big-btn" id="startDanBtn">この段でスタート</button>
        <div class="best-box">
          <h3 id="danBestTitle">🏆 ベスト3</h3>
          <ul class="best-list" id="danBestList"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- 出題画面 -->
  <div class="screen" id="quizScreen">
    <div class="countdown-box hidden" id="countdownBox">
      <div class="countdown-number" id="countdownNumber">3</div>
      <div class="countdown-label">よういはいい?</div>
    </div>
    <div class="question-box" id="questionBox">
      <div class="mode-label" id="modeLabel" style="display:none;"></div>
      <div class="qnum" id="qnum">第1問 / 10問</div>
      <div class="question-text" id="questionText">3 × 4 = ?</div>
    </div>
    <div class="choices" id="choices"></div>
  </div>

  <!-- 結果画面 -->
  <div class="screen" id="resultScreen">
    <div class="result-screen">
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-title" id="resultTitle"></div>
      <div id="resultBody"></div>
      <div class="best-box" id="resultBestBox" style="display:none;">
        <h3 id="resultBestTitle">🏆 じぶんのベスト3</h3>
        <ul class="best-list" id="resultBestList"></ul>
      </div>
      <div class="result-buttons">
        <button class="big-btn" id="retryBtn">もう一度チャレンジ</button>
        <button class="secondary-btn" id="backToMenuBtn">🏠 メニューへ戻る</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const startScreen = document.getElementById('startScreen');
  const quizScreen = document.getElementById('quizScreen');
  const resultScreen = document.getElementById('resultScreen');
  const retryBtn = document.getElementById('retryBtn');
  const backToMenuBtn = document.getElementById('backToMenuBtn');
  const stopwatchEl = document.getElementById('stopwatch');
  const progressBar = document.getElementById('progressBar');
  const qnumEl = document.getElementById('qnum');
  const modeLabelEl = document.getElementById('modeLabel');
  const questionBoxEl = document.getElementById('questionBox');
  const questionTextEl = document.getElementById('questionText');
  const choicesEl = document.getElementById('choices');
  const countdownBox = document.getElementById('countdownBox');
  const countdownNumber = document.getElementById('countdownNumber');
  const resultEmoji = document.getElementById('resultEmoji');
  const resultTitle = document.getElementById('resultTitle');
  const resultBody = document.getElementById('resultBody');
  const startBestList = document.getElementById('startBestList');
  const randomStampRow = document.getElementById('randomStampRow');
  const resultBestBox = document.getElementById('resultBestBox');
  const resultBestTitle = document.getElementById('resultBestTitle');
  const resultBestList = document.getElementById('resultBestList');

  // モード切り替えタブ
  const tabRandom = document.getElementById('tabRandom');
  const tabDan = document.getElementById('tabDan');
  const randomPanel = document.getElementById('randomPanel');
  const danPanel = document.getElementById('danPanel');
  const startRandomBtn = document.getElementById('startRandomBtn');
  const startDanBtn = document.getElementById('startDanBtn');
  const danGrid = document.getElementById('danGrid');
  const orderButtons = document.getElementById('orderButtons');
  const danBestTitle = document.getElementById('danBestTitle');
  const danBestList = document.getElementById('danBestList');
  const danStampRow = document.getElementById('danStampRow');

  const RANDOM_TOTAL = 10;
  const MAX_BEST = 3;
  const RANDOM_BEST_KEY = 'kuku_challenge_best3_v1'; // 既存データとの互換性を維持

  let allProblems = [];
  for(let a=1; a<=9; a++){
    for(let b=1; b<=9; b++){
      allProblems.push({a:a, b:b, answer:a*b});
    }
  }
  // ランダム10問モードでは1の段(1×N)と、◯×1(N×1)の問題も出題しない
  const randomProblems = allProblems.filter(q => q.a !== 1 && q.b !== 1);

  const ORDER_LABEL = {up:'上り', down:'下り', random:'ランダム'};

  // ===== スタンプ関連の定義 =====
  const STAMP_RANK = {bronze:1, silver:2, gold:3, platinum:4};
  const STAMP_EMOJI = {bronze:'🥉', silver:'🥈', gold:'🥇', platinum:'💎'};
  const STAMP_NAME = {bronze:'ブロンズ', silver:'シルバー', gold:'ゴールド', platinum:'プラチナ'};

  function getThresholds(mode){
    // ミリ秒単位のしきい値。このタイム以下ならそのスタンプを獲得
    if(mode.type === 'random'){
      return {platinum:15000, gold:17000, silver:20000};
    }
    // 段別モード（上り・下り・ランダムすべて共通のしきい値）
    return {platinum:10000, gold:14000, silver:18000};
  }

  function getStampTier(mode, elapsedMs){
    const th = getThresholds(mode);
    if(th.platinum !== undefined && elapsedMs <= th.platinum) return 'platinum';
    if(elapsedMs <= th.gold) return 'gold';
    if(elapsedMs <= th.silver) return 'silver';
    return 'bronze';
  }

  function stampKeyFor(mode){
    if(mode.type === 'random') return 'kuku_challenge_stamp_v1_random';
    return 'kuku_challenge_stamp_v1_dan' + mode.dan + '_' + mode.order;
  }

  function getStoredStamp(mode){
    try{
      return localStorage.getItem(stampKeyFor(mode));
    }catch(e){
      return null;
    }
  }

  function saveStamp(mode, tier){
    try{
      localStorage.setItem(stampKeyFor(mode), tier);
    }catch(e){
      // 保存できなくてもアプリの進行は止めない
    }
  }

  // 今回のタイムからスタンプを判定し、既存のベストスタンプより上位なら更新する
  function registerStamp(mode, elapsedMs){
    const tier = getStampTier(mode, elapsedMs);
    const prev = getStoredStamp(mode);
    const updated = !prev || STAMP_RANK[tier] > STAMP_RANK[prev];
    if(updated){
      saveStamp(mode, tier);
    }
    return {tier: tier, bestTier: updated ? tier : prev, updated: updated};
  }

  // 過去にクリア済みなのにスタンプ未保存(旧バージョンのデータ等)の場合、その場で作成する
  function ensureStamp(mode, bestTimeList){
    if(bestTimeList.length === 0) return null;
    let stamp = getStoredStamp(mode);
    if(!stamp){
      stamp = getStampTier(mode, bestTimeList[0]);
      saveStamp(mode, stamp);
    }
    return stamp;
  }

  let selectedDan = 2;
  let selectedOrder = 'up';

  let currentMode = {type:'random'};
  let questions = [];
  let currentIndex = 0;
  let correctCount = 0;
  let totalQuestions = RANDOM_TOTAL;
  let timerInterval = null;
  let startTime = 0;
  let finished = false;

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function bestKeyFor(mode){
    if(mode.type === 'random') return RANDOM_BEST_KEY;
    return 'kuku_challenge_best3_v1_dan' + mode.dan + '_' + mode.order;
  }

  function modeTitleFor(mode){
    if(mode.type === 'random') return 'ランダム10問';
    return mode.dan + 'の段(' + ORDER_LABEL[mode.order] + ')';
  }

  function pickQuestions(mode){
    if(mode.type === 'random'){
      return shuffle(randomProblems).slice(0, RANDOM_TOTAL);
    }
    const dan = mode.dan;
    let list = [];
    for(let b=1; b<=9; b++){
      list.push({a:dan, b:b, answer:dan*b});
    }
    if(mode.order === 'down'){
      list.reverse();
    } else if(mode.order === 'random'){
      list = shuffle(list);
    }
    return list;
  }

  function makeChoices(correctAnswer){
    const choicesSet = new Set([correctAnswer]);
    while(choicesSet.size < 4){
      const deltaOptions = [-9,-8,-6,-4,-3,-2,-1,1,2,3,4,6,8,9];
      const delta = deltaOptions[Math.floor(Math.random()*deltaOptions.length)];
      let candidate = correctAnswer + delta;
      if(candidate < 1) candidate = correctAnswer + Math.abs(delta);
      if(candidate === correctAnswer || candidate < 1 || candidate > 90) continue;
      choicesSet.add(candidate);
    }
    return shuffle(Array.from(choicesSet));
  }

  function formatTime(ms){
    return (ms/1000).toFixed(1) + '秒';
  }

  function startTimer(){
    startTime = Date.now();
    stopwatchEl.textContent = '0.0秒';
    timerInterval = setInterval(()=>{
      const elapsed = Date.now() - startTime;
      stopwatchEl.textContent = formatTime(elapsed);
    }, 100);
  }

  function stopTimer(){
    clearInterval(timerInterval);
    return Date.now() - startTime;
  }

  function showScreen(screen){
    [startScreen, quizScreen, resultScreen].forEach(s => s.classList.remove('active'));
    screen.classList.add('active');
  }

  function updateProgress(){
    const pct = (currentIndex / totalQuestions) * 100;
    progressBar.style.width = pct + '%';
  }

  function renderQuestion(){
    if(finished) return;
    const q = questions[currentIndex];
    qnumEl.textContent = '第' + (currentIndex+1) + '問 / ' + totalQuestions + '問';
    if(currentMode.type === 'dan'){
      modeLabelEl.style.display = 'block';
      modeLabelEl.textContent = modeTitleFor(currentMode);
    } else {
      modeLabelEl.style.display = 'none';
    }
    questionTextEl.textContent = q.a + ' × ' + q.b + ' = ?';
    updateProgress();

    const opts = makeChoices(q.answer);
    choicesEl.innerHTML = '';
    opts.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = opt;
      btn.addEventListener('click', () => handleAnswer(opt, q.answer, btn));
      choicesEl.appendChild(btn);
    });
  }

  function handleAnswer(selected, correctAnswer, btnEl){
    if(finished) return;
    const allBtns = choicesEl.querySelectorAll('.choice-btn');
    allBtns.forEach(b => b.disabled = true);

    if(selected === correctAnswer){
      btnEl.classList.add('correct');
      correctCount++;
      currentIndex++;
      updateProgress();
      if(correctCount >= totalQuestions){
        finished = true;
        const elapsed = stopTimer();
        setTimeout(()=> showClear(elapsed), 500);
      } else {
        setTimeout(renderQuestion, 500);
      }
    } else {
      finished = true;
      btnEl.classList.add('wrong');
      allBtns.forEach(b => {
        if(parseInt(b.textContent,10) === correctAnswer){
          b.classList.add('correct');
        }
      });
      stopTimer();
      const q = questions[currentIndex];
      setTimeout(()=> showFail(q, selected), 900);
    }
  }

  // ===== 自己ベスト3（この端末のlocalStorageに、モードごとに保存）=====
  function loadBest(key){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    }catch(e){
      return [];
    }
  }

  function saveBest(key, list){
    try{
      localStorage.setItem(key, JSON.stringify(list));
    }catch(e){
      // 保存できなくてもアプリの進行は止めない
    }
  }

  // elapsedMsを記録し、ベスト3入りしたかどうかの順位(入らなければ0)を返す
  function registerBest(key, elapsedMs){
    const list = loadBest(key);
    list.push(elapsedMs);
    list.sort((a,b) => a - b);
    const trimmed = list.slice(0, MAX_BEST);
    saveBest(key, trimmed);
    const rank = trimmed.indexOf(elapsedMs);
    return rank === -1 ? 0 : rank + 1;
  }

  function renderBestList(ulEl, key, highlightTime){
    const list = loadBest(key);
    ulEl.innerHTML = '';
    if(list.length === 0){
      ulEl.innerHTML = '<li class="best-empty">まだ記録がありません</li>';
      return;
    }
    list.forEach((time, idx) => {
      const rank = idx + 1;
      let rankClass = 'best-rank';
      if(rank === 1) rankClass += ' r1';
      else if(rank === 2) rankClass += ' r2';
      else if(rank === 3) rankClass += ' r3';
      const isNew = (highlightTime !== undefined && time === highlightTime);
      const li = document.createElement('li');
      li.className = 'best-item' + (isNew ? ' new' : '');
      li.innerHTML =
        '<div class="' + rankClass + '">' + rank + '</div>' +
        '<div class="best-time">' + formatTime(time) + '</div>';
      ulEl.appendChild(li);
    });
  }

  // メニュー画面の「クリアスタンプ＋ベストタイム」表示行を更新
  function renderStampRow(rowEl, mode){
    const list = loadBest(bestKeyFor(mode));
    if(list.length === 0){
      rowEl.innerHTML = '<span class="stamp-empty">まだクリアしていません</span>';
      return;
    }
    const stamp = ensureStamp(mode, list);
    rowEl.innerHTML =
      '<span class="stamp-icon">' + STAMP_EMOJI[stamp] + '</span>' +
      '<span>' + STAMP_NAME[stamp] + 'スタンプ ・ ベスト ' + formatTime(list[0]) + '</span>';
  }

  // 段グリッド／上り下りランダムボタンの右上バッジを更新
  function renderDanGridBadges(){
    danGrid.querySelectorAll('.dan-btn').forEach(btn => {
      const dan = parseInt(btn.dataset.dan, 10);
      const mode = {type:'dan', dan:dan, order:selectedOrder};
      const list = loadBest(bestKeyFor(mode));
      const badgeEl = btn.querySelector('.stamp-badge');
      badgeEl.textContent = list.length ? STAMP_EMOJI[ensureStamp(mode, list)] : '';
    });
  }

  function renderOrderButtonBadges(){
    orderButtons.querySelectorAll('.order-btn').forEach(btn => {
      const order = btn.dataset.order;
      const mode = {type:'dan', dan:selectedDan, order:order};
      const list = loadBest(bestKeyFor(mode));
      const badgeEl = btn.querySelector('.stamp-badge');
      badgeEl.textContent = list.length ? STAMP_EMOJI[ensureStamp(mode, list)] : '';
    });
  }

  function renderDanBestPreview(){
    const mode = {type:'dan', dan:selectedDan, order:selectedOrder};
    danBestTitle.textContent = '🏆 ' + selectedDan + 'の段(' + ORDER_LABEL[selectedOrder] + ')のベスト3';
    renderBestList(danBestList, bestKeyFor(mode));
    renderStampRow(danStampRow, mode);
    renderDanGridBadges();
    renderOrderButtonBadges();
  }

  // メニュー画面全体(ランダムパネル＋段パネル)を最新の記録で再描画
  function refreshMenu(){
    renderBestList(startBestList, RANDOM_BEST_KEY);
    renderStampRow(randomStampRow, {type:'random'});
    renderDanBestPreview();
  }

  function showClear(elapsedMs){
    const bestKey = bestKeyFor(currentMode);
    const rank = registerBest(bestKey, elapsedMs);
    const stampResult = registerStamp(currentMode, elapsedMs);

    resultEmoji.textContent = '🎉';
    resultTitle.textContent = 'クリア!';
    resultTitle.className = 'result-title clear';
    resultBody.innerHTML =
      '<p style="color:#a87a4a;font-weight:bold;margin:0 0 4px;">' + modeTitleFor(currentMode) + '</p>' +
      '<div class="earned-stamp-box">' +
        '<div class="earned-stamp-emoji">' + STAMP_EMOJI[stampResult.tier] + '</div>' +
        '<div class="earned-stamp-name">' + STAMP_NAME[stampResult.tier] + 'スタンプ獲得!</div>' +
        (stampResult.updated ? '<div class="earned-stamp-new">✨ 自己ベストスタンプ更新!</div>' : '') +
      '</div>' +
      (rank > 0 ? '<div class="new-record-badge">🏅 じぶんのベスト' + rank + '位!</div>' : '') +
      '<div class="time-display">タイム: ' + formatTime(elapsedMs) + '</div>' +
      '<p>' + totalQuestions + '問全問正解、おめでとう!</p>';
    resultBestBox.style.display = 'block';
    resultBestTitle.textContent = '🏆 ' + modeTitleFor(currentMode) + ' ベスト3';
    renderBestList(resultBestList, bestKey, rank > 0 ? elapsedMs : undefined);
    showScreen(resultScreen);
  }

  function showFail(q, selected){
    resultBestBox.style.display = 'none';
    resultEmoji.textContent = '😢';
    resultTitle.textContent = '残念、終了です';
    resultTitle.className = 'result-title fail';
    resultBody.innerHTML =
      '<p style="color:#a87a4a;font-weight:bold;margin:0 0 4px;">' + modeTitleFor(currentMode) + '</p>' +
      '<div class="fail-detail">' +
        '<div class="q">' + q.a + ' × ' + q.b + ' = ' + q.answer + '</div>' +
        'あなたの答え: ' + selected +
      '</div>' +
      '<p>記録は残りません。もう一度チャレンジしてみよう!</p>';
    showScreen(resultScreen);
  }

  function startQuiz(mode){
    currentMode = mode;
    finished = false;
    currentIndex = 0;
    correctCount = 0;
    questions = pickQuestions(mode);
    totalQuestions = questions.length;
    showScreen(quizScreen);
    updateProgress();
    stopwatchEl.textContent = '0.0秒';
    startCountdown(() => {
      startTimer();
      renderQuestion();
    });
  }

  // スタートボタンを押してから3秒間のカウントダウンを表示する
  // （カウントダウン中は問題文・選択肢は非表示）
  function startCountdown(onDone){
    questionBoxEl.classList.add('hidden');
    choicesEl.classList.add('hidden');
    countdownBox.classList.remove('hidden');

    let count = 3;
    countdownNumber.textContent = count;
    const interval = setInterval(() => {
      count--;
      if(count > 0){
        countdownNumber.textContent = count;
      } else if(count === 0){
        countdownNumber.textContent = 'スタート!';
      } else {
        clearInterval(interval);
        countdownBox.classList.add('hidden');
        questionBoxEl.classList.remove('hidden');
        choicesEl.classList.remove('hidden');
        onDone();
      }
    }, 1000);
  }

  // ===== モード切り替えタブのイベント =====
  tabRandom.addEventListener('click', () => {
    tabRandom.classList.add('active');
    tabDan.classList.remove('active');
    randomPanel.style.display = 'block';
    danPanel.style.display = 'none';
  });
  tabDan.addEventListener('click', () => {
    tabDan.classList.add('active');
    tabRandom.classList.remove('active');
    danPanel.style.display = 'block';
    randomPanel.style.display = 'none';
  });

  // ===== 段えらびボタンの生成 =====
  for(let d=2; d<=9; d++){
    const btn = document.createElement('button');
    btn.className = 'dan-btn' + (d === selectedDan ? ' selected' : '');
    btn.dataset.dan = d;
    const badge = document.createElement('span');
    badge.className = 'stamp-badge';
    btn.appendChild(badge);
    btn.appendChild(document.createTextNode(d + 'の段'));
    btn.addEventListener('click', () => {
      selectedDan = d;
      danGrid.querySelectorAll('.dan-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      renderDanBestPreview();
    });
    danGrid.appendChild(btn);
  }

  // ===== 上り/下り/ランダムボタン =====
  orderButtons.querySelectorAll('.order-btn').forEach(btn => {
    if(btn.dataset.order === selectedOrder) btn.classList.add('selected');
    btn.addEventListener('click', () => {
      selectedOrder = btn.dataset.order;
      orderButtons.querySelectorAll('.order-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      renderDanBestPreview();
    });
  });

  startRandomBtn.addEventListener('click', () => startQuiz({type:'random'}));
  startDanBtn.addEventListener('click', () => startQuiz({type:'dan', dan:selectedDan, order:selectedOrder}));
  retryBtn.addEventListener('click', () => startQuiz(currentMode));
  backToMenuBtn.addEventListener('click', () => {
    refreshMenu();
    showScreen(startScreen);
  });

  // 初期表示
  refreshMenu();
})();
</script>
</body>
</html>
