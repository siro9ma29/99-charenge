  <g id="flBlue"><use href="#fp" fill="#7fc8ff" stroke="#2b2b3a" stroke-width="1.4"/><circle r="3.2" fill="#fff"/></g>
  <g id="flYel"><use href="#fp" fill="#ffe066" stroke="#2b2b3a" stroke-width="1.4"/><circle r="3.2" fill="#ff9a3a"/></g>
